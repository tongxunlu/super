port: 7890
allow-lan: true
mode: rule
log-level: info
unified-delay: true
dns:
  enable: true 
  listen: "0.0.0.0:1053"
  ipv6: true
  prefer-h3: false
  respect-rules: true
  use-system-hosts: false
  cache-algorithm: "arc"
  enhanced-mode: "fake-ip"
  fake-ip-range: "198.18.0.1/16"
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
    - "+.in-addr.arpa"
    - "+.ip6.arpa"
    - "time.*.com"
    - "time.*.gov"
    - "pool.ntp.org"
    - "localhost.work.weixin.qq.com"
  default-nameserver: ["223.5.5.5", "119.29.29.29"]
  nameserver:
    - "https://1.1.1.1/dns-query"
    - "https://8.8.8.8/dns-query"
  proxy-server-nameserver:
    - "https://223.5.5.5/dns-query"
    - "https://doh.pub/dns-query"

proxies:
  - name: hk海创无限流量
    type: vless
    server: 45.207.153.189
    port: 21120
    uuid: 3e5c9c93-5de7-4d8d-9185-5c6d0fdc6932
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: apple.com
    client-fingerprint: chrome
    reality-opts:
      public-key: 1ocJgrhWBEOmVWcvJno1WTZIiBE6hwz9cyBsAFl66xo
      short-id: 2478e1d5

  - name: Vless-Reality-Vision-2
    type: vless
    server: 218.252.243.113
    port: 46942
    uuid: d6dccf16-8ade-4cc0-afde-d7a16b57e615
    network: tcp
    tls: true
    udp: true
    flow: xtls-rprx-vision
    servername: apple.com
    client-fingerprint: chrome
    reality-opts:
      public-key: N2GK9O0_uaGhm7ZAVAZD6HxD0oCseGd5J2DQbeszzDs
      short-id: 73d2fe7e

proxy-groups:
  - name: 负载均衡
    type: load-balance
    url: https://www.gstatic.com/generate_204
    interval: 300
    strategy: round-robin
    proxies:
      - hk海创无限流量
      - Vless-Reality-Vision-2

  - name: 自动选择
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - hk海创无限流量
      - Vless-Reality-Vision-2

  - name: 🌍选择代理节点
    type: select
    proxies:
      - 负载均衡
      - 自动选择
      - hk海创无限流量
      - Vless-Reality-Vision-2
      - DIRECT

rules:
  - GEOIP,LAN,DIRECT
  - GEOSITE,CN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,🌍选择代理节点
